name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Uses the recommended Node 24 runtime

      - name: Install Puppeteer and Chrome
        run: |
          npm install puppeteer
          npx puppeteer browsers install chrome

      - name: Visit App with Headless Browser
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'] 
            });
            const page = await browser.newPage();
            console.log('Visiting app...');
            await page.goto('https://alphafactordiscovery.streamlit.app/', { waitUntil: 'networkidle2', timeout: 60000 });
            console.log('App loaded successfully!');
            await browser.close();
          })();
          "
